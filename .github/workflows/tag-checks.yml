name: Tag checks

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: tag-checks-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Validate tag and package version match
        shell: bash
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"

          if [[ "$TAG_VERSION" != "$PKG_VERSION" ]]; then
            echo "Tag/package version mismatch: tag=$TAG_VERSION package.json=$PKG_VERSION" >&2
            exit 1
          fi

      - name: Check if version is already published
        shell: bash
        run: |
          set -euo pipefail
          PKG_NAME="$(node -p "require('./package.json').name")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"

          if npm view "$PKG_NAME@$TAG_VERSION" version >/dev/null 2>&1; then
            echo "Package $PKG_NAME@$TAG_VERSION is already on npm."
          else
            echo "Package $PKG_NAME@$TAG_VERSION is not published yet."
          fi
